# Builds the Windows installers and publishes them as a GitHub Release.
#
# Runs when a version tag is pushed (e.g. `git tag v0.2.0 && git push origin v0.2.0`),
# or by hand from the Actions tab. The release is created as a draft: check it,
# then click "Publish release" on GitHub.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the updater signing key (contents of the .key file)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#
# Actions are pinned to commit SHAs: this job can read the signing key, so a
# moved tag must not be able to change what runs. Dependabot keeps them current.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and upload its files

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and tags, for the list of changes

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Pinned to a commit, so the toolchain has to be named (it's otherwise read from the tag).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare bundled OCR and verify English recognition
        run: npm run prepare:ocr

      - name: Test
        run: |
          npx tsc --noEmit
          cd src-tauri
          cargo test --locked

      # The same text for every release: what to download, then the commits
      # since the previous version tag. Checksums are added after the build.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          prev=$(git describe --tags --abbrev=0 --match 'v*' "v$version^" 2>/dev/null || git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          {
            echo 'body<<END_OF_NOTES'
            echo "**Windows 10 / 11.** Download the \`…_x64-setup.exe\` installer below and run it."
            echo 'Tesseract OCR and English language data are included; no separate OCR installation is needed.'
            echo
            echo 'Already installed? The app updates itself the next time it starts.'
            echo
            echo "### Changes${prev:+ since $prev}"
            git log --no-merges --pretty='- %s (%h)' "$range"
            echo 'END_OF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # __VERSION__ is filled in from tauri.conf.json.
          tagName: v__VERSION__
          releaseName: Motherlode Uplink v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # Uploads latest.json, which the in-app updater reads.
          uploadUpdaterJson: true

      # SHA-256 of each download, as SHA256SUMS.txt and in the release notes, so
      # players can check a file is exactly what was published.
      - name: Checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          node .github/scripts/release-checksums.mjs
          gh release upload "v$VERSION" SHA256SUMS.txt --clobber
          gh release edit "v$VERSION" --notes-file notes.md
