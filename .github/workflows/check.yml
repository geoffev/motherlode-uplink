# Type check, build and tests on every pull request (Dependabot's included) and
# every push to main. Needs no secrets.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows, so the Windows-only capture code is compiled and tested too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # Pinned to a commit, so the toolchain has to be named (it's otherwise read from the tag).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Known vulnerabilities in npm packages
        run: npm audit --audit-level=high

      - name: Type check and build the frontend
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
